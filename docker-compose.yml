
services:
  student-app:
    build: .
    image: tokarev-arthur-devops
    container_name: tokarev-arthur-compose
    ports:
      - "8000:8000"
    environment:
      STUDENT_NAME: Arthur
      STUDENT_SURNAME: Tokarev
      STUDENT_GROUP: IT2-2312
      STUDENT_ID: YOUR_STUDENT_ID
    restart: unless-stopped
